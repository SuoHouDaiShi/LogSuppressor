name: Build Jar with Gradle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle   # 会自动缓存 ~/.gradle/caches

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'   # 指定 Gradle 版本（可根据项目需要调整）
        # 若想用 wrapper 而你又补齐了文件，则可以不写 gradle-version

    - name: Build with Gradle
      run: gradle build   # 注意这里不是 ./gradlew，而是 gradle

    - name: Upload Jar artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: build/libs/*.jar
