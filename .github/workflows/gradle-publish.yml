name: Build Jar with Gradle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 如果你仍想保留 release 触发，可以取消下面注释
  # release:
  #   types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 读取代码需要
      # 不再需要 packages: write，因为不发布

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'          # 启用 Gradle 依赖缓存，加速构建

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew     # 关键步骤，避免权限错误

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4   # 使用最新稳定版，你也可以保留原来的哈希

    - name: Build with Gradle (skip tests optional)
      run: ./gradlew build      # 或者 bootJar / shadowJar，视项目而定

    - name: Upload Jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-jar
        path: build/libs/*.jar   # Gradle 默认输出目录
